name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Storage guarantees differ per OS (fsync, locks, case-insensitive file systems), so every suite runs on all three.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The test runner needs Node 22.15+ (Vitest 5, the TypeScript-source engine worker); see docs/PHASES.md, Phase 0 results.
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
