name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Storage guarantees differ per OS (fsync, locks, case-insensitive file systems), so every suite runs on all three.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The test runner needs Node 22.15+ (Vitest 5, the TypeScript-source engine worker); see docs/PHASES.md, Phase 0 results.
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: npm test
        shell: bash
        run: npm test 2>&1 | tee test.log; exit "${PIPESTATUS[0]}"
      # Job logs need a token to read; annotations are public, so a failure also lands there.
      - name: Report the end of the test log
        if: failure()
        shell: bash
        run: |
          grep -nE 'FAIL|Error|Unhandled|EBUSY|EPERM|ENOTEMPTY|failed' test.log | tail -n 40 > tail.txt || true
          tail -n 40 test.log >> tail.txt
          body=$(sed -e 's/%/%25/g' tail.txt | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=npm test::${body}"
